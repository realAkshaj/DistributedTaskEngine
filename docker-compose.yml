services:
  postgres:
    image: postgres:16-alpine
    container_name: dte-postgres
    environment:
      POSTGRES_DB: dte
      POSTGRES_USER: dte
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dte", "-d", "dte"]
      interval: 5s
      timeout: 3s
      retries: 10

  orchestrator:
    build:
      context: .
      dockerfile: src/Orchestrator/Dockerfile
    container_name: dte-orchestrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=postgres;Database=dte;Username=dte;Password=${POSTGRES_PASSWORD:-changeme}"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:5001:5001"

  worker:
    build:
      context: .
      dockerfile: src/worker/Dockerfile
    depends_on:
      - orchestrator
    restart: unless-stopped
    environment:
      DTE_ORCHESTRATOR: "orchestrator:5001"
      DTE_MAX_PARALLEL: "4"
      DTE_JOB_TYPES: "graph.bfs,noop"

  grafana:
    image: grafana/grafana:latest
    container_name: dte-grafana
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  pgdata:
  grafana-data:
